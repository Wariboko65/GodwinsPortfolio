<template>
  <style>
    @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/schibsted.woff2") format("woff2"); font-weight: 400 900; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jbmono.woff2") format("woff2"); font-weight: 100 800; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0d0f12; }
    #hk-cam { position: absolute; inset: 0; transform-origin: 700px 600px; }
    #hk-name { position: absolute; left: 160px; top: 330px; font-family: "Schibsted Grotesk"; font-weight: 800; font-size: 150px; letter-spacing: -0.04em; color: #eceae4; white-space: nowrap; }
    #hk-name span { display: inline-block; }
    .hk-mono { position: absolute; left: 166px; font-family: "JetBrains Mono"; white-space: pre; }
    #hk-sw { top: 540px; font-size: 60px; font-weight: 700; color: #c8f169; }
    #hk-role { top: 640px; font-size: 40px; font-weight: 500; color: #9ea3ab; }
    .hk-mono i { font-style: normal; }
    #hk-caret { position: absolute; left: 166px; top: 548px; width: 30px; height: 64px; background: #c8f169; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <div id="hk-stage" class="clip" data-start="0" data-duration="2.6" data-track-index="0" style="position:absolute;inset:0">
      <div id="hk-cam">
        <div id="hk-name"><span>J</span><span>o</span><span>h</span><span>n</span><span>&nbsp;</span><span>G</span><span>o</span><span>d</span><span>w</span><span>i</span><span>n</span><span>&nbsp;</span><span>O</span><span>a</span><span>m</span><span>i</span><span>e</span><span>n</span></div>
        <div id="hk-sw" class="hk-mono"><i>/</i><i>s</i><i>o</i><i>f</i><i>t</i><i>w</i><i>a</i><i>r</i><i>e</i></div>
        <div id="hk-role" class="hk-mono">Frontend / Full Stack Developer</div>
        <div id="hk-caret"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // frame 0 is the thumbnail: the first name is already there, the rest lands a letter at a time
      gsap.utils.toArray("#hk-name span").forEach((s, i) => {
        tl.fromTo(s, { opacity: i < 4 ? 1 : 0, filter: i < 4 ? "blur(0px)" : "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.12, ease: "power4.out" }, Math.max(0, (i - 3) * 0.03));
      });
      // "/software" is typed: one key a character, the caret (one mono cell = 0.6 em = 36 px) walks with it
      const keys = gsap.utils.toArray("#hk-sw i");
      keys.forEach((k, i) => tl.fromTo(k, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.7 + i * 0.055));
      tl.fromTo("#hk-caret", { x: 0 }, { x: 36 * 9, duration: 9 * 0.055, ease: "steps(9)" }, 0.7);
      // the role arrives as one line, then the caret blinks twice
      tl.fromTo("#hk-role", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.35);
      tl.fromTo("#hk-caret", { opacity: 1 }, { opacity: 0, duration: 0.01, repeat: 3, yoyo: true, repeatDelay: 0.22 }, 1.3);
      // push into the caret: it becomes the first node of the booking flow
      tl.to("#hk-cam", { scale: 6, x: -330, y: 40, filter: "blur(6px)", duration: 0.42, ease: "power3.in" }, 2.18);
      tl.to("#hk-stage", { opacity: 0, duration: 0.12 }, 2.48);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
